site_name: Argonaut Documentation
site_url: https://sitename.example
theme:
  name: material
  font:
    # all google fonts are available
    text: Merriweather sans
    code: Red Hat Mono
  # https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  icon:
    logo: fontawesome/solid/anchor
#  logo: assets/logo.png
#  favicon: assets/favicon.ico
  features:
    - navigation.footer
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

# https://facelessuser.github.io/pymdown-extensions/extensions/emoji/
markdown_extensions:
  - attr_list

  # emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # code highlighting
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # fences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # admonitions
  - admonition
  - pymdownx.details

extra:
  social:
    - icon: simple/youtube
      link: https://youtube.com/@
    - icon: simple/instagram
      link: https://www.instagram.com/noaa_aoml

copyright: Copyright &copy; 2026 NOAA NCEI